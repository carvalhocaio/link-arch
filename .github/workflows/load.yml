name: Load & Stress Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target environment URL (e.g. https://link-arch.vercel.app)"
        required: true
        default: "https://link-arch.vercel.app"
      test_key:
        description: "Existing short key to use for the redirect load test"
        required: false
        default: "smoke"
  schedule:
    # Runs every Sunday at 03:00 UTC against production
    - cron: "0 3 * * 0"

jobs:
  load-redirect:
    name: Load Test — Redirect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run redirect load test
        run: k6 run tests/load/redirect.js
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://link-arch.vercel.app' }}
          TEST_KEY: ${{ github.event.inputs.test_key || 'smoke' }}

  stress-shorten:
    name: Stress Test — Shorten
    runs-on: ubuntu-latest
    needs: load-redirect

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run shorten stress test
        run: k6 run tests/load/shorten.js
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://link-arch.vercel.app' }}
