name: E2E Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: link_arch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d link_arch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/link_arch_test
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-prod
      BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: bun run src/migrate.ts

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Build app
        working-directory: apps/web
        run: bun run build

      - name: Start app
        working-directory: apps/web
        run: bun run start -- -p 3001 &

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && break
            echo "Waiting for app... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        working-directory: apps/web
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
